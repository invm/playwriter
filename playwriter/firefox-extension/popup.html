<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 280px; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #1f1f23; color: #eee; } .muted { color: #aaa !important; } button { background: #2d2d33; color: #eee; border-color: #444 !important; } }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.on { background: #22c55e; }
  .muted { color: #555; font-size: 12px; margin: 4px 0; }
  button { display: block; width: 100%; margin: 6px 0; padding: 7px; border: 1px solid #ccc; border-radius: 6px; font: inherit; cursor: pointer; }
  button.primary { background: #22c55e; color: #fff; border-color: #16a34a !important; }
  button.danger { background: #dc2626; color: #fff; border-color: #b91c1c !important; }
  button:disabled { opacity: .5; cursor: default; }
  hr { border: 0; border-top: 1px solid #8884; margin: 10px 0; }
  .hidden { display: none; }
  #error { color: #dc2626; }
</style>
</head>
<body>
<h1><span id="dot" class="dot"></span>Playwriter</h1>
<div id="status" class="muted">Checking relay...</div>
<div id="detail" class="muted"></div>
<div id="main">
  <button id="toggle" class="primary" disabled>Connect this tab</button>
  <p class="muted">Automation stays on until the last tab is disconnected. Then you can restart normally (tabs reopen).</p>
  <hr>
  <button id="restart-automation">Restart with automation</button>
  <button id="restart-normal">Restart normally</button>
</div>
<div id="confirm" class="hidden">
  <p id="confirm-text"></p>
  <button id="confirm-yes" class="danger">Restart</button>
  <button id="confirm-no">Cancel</button>
</div>
<p id="error"></p>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
